<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Event Entry Guest Tracker logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2d5bbf"/>
    </linearGradient>
    <linearGradient id="checkbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ecf8e"/>
      <stop offset="1" stop-color="#28a06c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f1420" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded app badge -->
  <rect x="20" y="20" width="280" height="280" rx="68" fill="url(#bg)" filter="url(#soft)"/>

  <!-- Entry doorway / arch -->
  <path d="M104 236 L104 148 A56 56 0 0 1 216 148 L216 236"
        fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.95"/>
  <!-- Threshold -->
  <line x1="92" y1="236" x2="228" y2="236" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

  <!-- Guest silhouette walking through the entrance -->
  <circle cx="160" cy="138" r="20" fill="#ffffff"/>
  <path d="M132 214 C132 182 148 168 160 168 C172 168 188 182 188 214 Z" fill="#ffffff"/>

  <!-- Check badge (tracked / confirmed) -->
  <circle cx="222" cy="214" r="34" fill="url(#checkbg)" stroke="#0f1420" stroke-width="4" stroke-opacity="0.15"/>
  <path d="M207 214 L218 225 L238 201"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
